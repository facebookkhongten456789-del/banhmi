<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlowXaXiu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crustXaXiu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="xaxiuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />  <!-- Dark red edge -->
      <stop offset="15%" stop-color="#fda4af" /> <!-- Tender pink meat -->
      <stop offset="85%" stop-color="#fda4af" /> <!-- Tender pink meat -->
      <stop offset="100%" stop-color="#be123c" /> <!-- Dark red edge -->
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#fffbf7" />
  <circle cx="200" cy="150" r="130" fill="url(#bgGlowXaXiu)" />

  <!-- Special Tag -->
  <g transform="translate(320, 40)">
    <circle cx="0" cy="0" r="24" fill="#be123c" />
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">MẬT</text>
    <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">ONG</text>
  </g>

  <!-- Banh Mi Group -->
  <g filter="url(#cardShadow)" transform="translate(10, 10)">
    <!-- Back Crust -->
    <path d="M 70,180 C 60,150 110,110 160,100 C 220,90 310,100 340,130 C 360,145 350,170 330,180 C 280,205 120,210 70,180 Z" fill="url(#crustXaXiu)" />
    
    <!-- Rich Honey Glaze Sauce -->
    <path d="M 90,165 C 130,155 250,148 310,162 C 280,172 200,175 140,172 C 110,174 90,168 90,165 Z" fill="#991b1b" />

    <!-- Cucumber slices -->
    <ellipse cx="140" cy="153" rx="20" ry="8" fill="#16a34a" transform="rotate(-12, 140, 153)" stroke="#f0fdf4" stroke-width="1.5" />
    <ellipse cx="250" cy="148" rx="22" ry="9" fill="#16a34a" transform="rotate(8, 250, 148)" stroke="#f0fdf4" stroke-width="1.5" />

    <!-- Char Siu Pork Slices (Thịt Xá Xíu) -->
    <!-- Slice 1 -->
    <g transform="translate(100, 138) rotate(-15)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="url(#xaxiuGrad)" stroke="#9f1239" stroke-width="1.5" />
      <!-- Grill marks -->
      <line x1="8" y1="4" x2="12" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="4" x2="20" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="24" y1="4" x2="28" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- Slice 2 -->
    <g transform="translate(155, 128) rotate(-5)">
      <rect x="0" y="0" width="40" height="26" rx="6" fill="url(#xaxiuGrad)" stroke="#9f1239" stroke-width="1.5" />
      <line x1="10" y1="4" x2="14" y2="22" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="18" y1="4" x2="22" y2="22" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="26" y1="4" x2="30" y2="22" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- Slice 3 -->
    <g transform="translate(210, 130) rotate(10)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="url(#xaxiuGrad)" stroke="#9f1239" stroke-width="1.5" />
      <line x1="8" y1="4" x2="12" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="4" x2="20" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="24" y1="4" x2="28" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- Slice 4 -->
    <g transform="translate(265, 138) rotate(20)">
      <rect x="0" y="0" width="36" height="24" rx="6" fill="url(#xaxiuGrad)" stroke="#9f1239" stroke-width="1.5" />
      <line x1="8" y1="4" x2="12" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="4" x2="20" y2="20" stroke="#701a28" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Pickled Carrots (Đồ chua) -->
    <g stroke="#f97316" stroke-width="3" stroke-linecap="round">
      <line x1="110" y1="135" x2="135" y2="148" />
      <line x1="165" y1="128" x2="190" y2="140" />
      <line x1="230" y1="130" x2="255" y2="142" />
      <line x1="280" y1="138" x2="305" y2="148" stroke="#e7e5e4" stroke-width="2" />
    </g>

    <!-- Cilantro Leaf -->
    <g fill="#15803d">
      <path d="M 150,132 C 145,125 152,117 158,122 C 164,117 170,125 165,132 Z" />
      <path d="M 230,128 C 225,121 232,113 238,118 C 244,118 250,121 245,128 Z" />
      <path d="M 125,145 Q 200,130 290,140" fill="none" stroke="#16a34a" stroke-width="1.5" />
    </g>

    <!-- Front Crust Overlay -->
    <path d="M 68,160 C 58,130 110,90 160,80 C 225,70 305,80 338,115 C 358,130 358,155 330,165 C 280,135 120,130 68,160 Z" fill="url(#crustXaXiu)" />
    <path d="M 85,135 C 120,105 200,90 280,95 C 310,100 330,115 335,130 C 285,110 150,110 85,135 Z" fill="#fef3c7" opacity="0.4" />

    <!-- Slashes -->
    <path d="M 130,115 Q 145,110 150,128" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 200,105 Q 215,100 220,118" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 270,108 Q 285,103 290,121" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
